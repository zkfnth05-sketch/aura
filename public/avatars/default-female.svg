<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#2a1e27" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradFemale)" />
  <circle cx="200" cy="180" r="160" fill="url(#roseGlow)" />

  <!-- Aura Ring -->
  <circle cx="200" cy="150" r="75" fill="none" stroke="url(#roseGoldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 6" />

  <!-- Female Silhouette -->
  <g fill="url(#roseGoldGrad)" opacity="0.85">
    <!-- Hair outline/waves -->
    <path d="M140 160 C135 110, 160 85, 200 85 C240 85, 265 110, 260 160 C265 195, 260 230, 250 250 C240 235, 245 190, 245 160 C240 115, 225 105, 200 105 C175 105, 160 115, 155 160 C155 190, 160 235, 150 250 C140 230, 135 195, 140 160 Z" opacity="0.5" />
    
    <!-- Head -->
    <circle cx="200" cy="150" r="50" />
    
    <!-- Neck & Shoulders -->
    <path d="M184 205 L216 205 L222 235 C250 245, 295 268, 315 315 C318 324, 314 334, 305 334 L95 334 C86 334, 82 324, 85 315 C105 268, 150 245, 178 235 Z" />
  </g>

  <!-- Minimal Icon Badge -->
  <g transform="translate(176, 348)">
    <rect width="48" height="22" rx="11" fill="#27272a" stroke="#F43F5E" stroke-width="1" opacity="0.9" />
    <text x="24" y="15" fill="#FDA4AF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AURA</text>
  </g>
</svg>
