<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradMale)" />
  <circle cx="200" cy="180" r="160" fill="url(#auraGlow)" />

  <!-- Aura Ring -->
  <circle cx="200" cy="155" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="6 6" />

  <!-- Male Silhouette -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Head -->
    <circle cx="200" cy="155" r="54" />
    <!-- Hair volume touch -->
    <path d="M150 155 C150 115, 170 95, 200 95 C230 95, 250 115, 250 155 C240 120, 225 110, 200 110 C175 110, 160 120, 150 155 Z" opacity="0.4" />
    
    <!-- Neck & Shoulders -->
    <path d="M182 215 L218 215 L224 245 C255 255, 305 275, 325 320 C328 328, 324 336, 315 336 L85 336 C76 336, 72 328, 75 320 C95 275, 145 255, 176 245 Z" />
  </g>

  <!-- Minimal Icon Badge -->
  <g transform="translate(176, 348)">
    <rect width="48" height="22" rx="11" fill="#27272a" stroke="#E5A934" stroke-width="1" opacity="0.9" />
    <text x="24" y="15" fill="#FCD34D" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AURA</text>
  </g>
</svg>
